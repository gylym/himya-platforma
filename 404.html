<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <title>Үздіксіз білім беру платформасы</title>
    <script>
      const segmentsToKeep = 1;
      const location = window.location;
      const repositoryRoot = location.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/");
      const route = location.pathname.slice(1).split("/").slice(segmentsToKeep).join("/");
      location.replace(`${location.protocol}//${location.host}${repositoryRoot}/?/${route.replace(/&/g, "~and~")}${location.search.replace(/&/g, "~and~")}${location.hash}`);
    </script>
  </head>
  <body></body>
</html>
