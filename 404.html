<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <title>Үздіксіз білім беру платформасы</title>
    <script>
      const segmentsToKeep = 1;
      const pageLocation = window.location;
      const repositoryRoot = pageLocation.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/");
      const route = pageLocation.pathname.slice(1).split("/").slice(segmentsToKeep).join("/");
      pageLocation.replace(`${pageLocation.protocol}//${pageLocation.host}${repositoryRoot}/?/${route.replace(/&/g, "~and~")}${pageLocation.search.replace(/&/g, "~and~")}${pageLocation.hash}`);
    </script>
  </head>
  <body></body>
</html>
