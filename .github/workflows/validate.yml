name: Validate platform
on:
  pull_request:
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/platform.mjs tests/redox.mjs
      - run: python3 tests/integration.py
      - run: python3 tests/security.py
      - run: node build.mjs
