<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8fc" />
    <title>Үздіксіз білім беру платформасы</title>
    <link rel="icon" href="data:," />
    <script>
      // Keep static assets anchored to the application root even when a
      // GitHub Pages deep link is restored with the History API.
      document.write(
        `<base href="${location.hostname.endsWith("github.io") ? "/himya-platforma/" : "/"}">`,
      );

      (function (location) {
        if (location.search.startsWith("?/")) {
          const route = location.search.slice(2).replace(/~and~/g, "&");
          history.replaceState({}, "", `${location.pathname.replace(/\/$/, "")}/${route}${location.hash}`);
        }
      })(window.location);
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="accessibility.css" />
    <link rel="stylesheet" href="learning.css" />
    <link rel="stylesheet" href="platform.css" />
    <meta name="description" content="Химия пәні бойынша оқу материалдары, тапсырмалар және пайдалы ресурстар." />
  </head>
  <body>
    <a class="skip-link" href="#main">Негізгі мазмұнға өту</a>
    <div id="app"></div>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
